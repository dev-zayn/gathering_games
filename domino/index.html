<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b3d2e">
  <title>لعبة الدومينو</title>
  <!-- لعبة الدومينو (arcade.domino): a game for گعدة, served beside its
       manifest in .well-known/. Classic double-six dominoes for 2–4 players,
       turn by turn: draw from the boneyard, match an open end, first to empty
       their hand wins the round; scores run to a target. The board lays the
       chain as a connected rectangular loop with 90° corners and crosswise
       doubles. In a گعدة room every player is on their own phone and the
       host's phone runs the game (room.js); outside one, one player against
       the computer. Plain HTML, CSS and JS: no build step, nothing loaded
       from the network; opened from disk it just works. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app">
  <div class="brand">
    <div class="logo"><span></span><span></span><span></span><span></span></div>
    <div>
      <h1>لعبة الدومينو</h1>
      <p><a href="https://docs.ga3da.fun/" target="_blank" rel="noopener" class="sitelink">ga3da.fun</a> — كلاسيك ٦×٦</p>
    </div>
  </div>
  <div class="toolbar">
    <a class="btn ghost" href="https://docs.ga3da.fun/" target="_blank" rel="noopener">الموقع</a>
    <button class="btn ghost" id="rulesBtn">القوانين</button>
    <button class="btn ghost" id="logBtn">السجل</button>
    <button class="btn" id="newBtn">لعبة جديدة</button>
    <button class="btn ghost" id="endBtn" hidden>إنهاء الجولة</button>
  </div>
</header>

<main>
  <button type="button" class="matchbar" id="match" hidden></button>
  <div class="scoreboard" id="scoreboard"></div>

  <div class="felt">
    <div class="status" id="status">مرحبًا بك!</div>
    <div class="ends" id="ends"></div>
    <div class="boardwrap"><div class="board empty" id="board"></div></div>
  </div>

  <div class="handwrap">
    <div class="hand-title">
      <b>أحجارك</b>
      <span id="handInfo" style="font-size:13px;color:#cfe8dc"></span>
    </div>
    <div class="hand" id="hand"></div>
    <div class="endpick" id="endpick" style="text-align:center;font-size:13px;color:var(--gold);min-height:18px;margin-top:4px"></div>
    <div class="controls">
      <button class="btn" id="drawBtn">اسحب من الكومة</button>
      <button class="btn ghost" id="passBtn">مرر الدور</button>
    </div>
  </div>
</main>

<div class="log" id="logBox"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Setup / Winner modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="rules.js"></script>
<script src="room.js"></script>
<script src="app.js"></script>
</body>
</html>
